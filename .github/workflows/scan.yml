name: OUO Daily Scan
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 lxml
      - run: python scanner.py
      - name: Commit results
        run: |
          git config user.name "OUO Intelligence"
          git config user.email "actions@github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Scan results $(date '+%Y-%m-%d')"
          git push
